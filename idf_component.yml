description: Tanmatsu LoRa component
url: https://github.com/nicolai-electronics/esp32-component-tanmatsu-lora
repository: git://git@github.com:nicolai-electronics/esp32-component-tanmatsu-lora.git
issues: https://github.com/nicolai-electronics/esp32-component-tanmatsu-lora/issues
dependencies:
  idf: ">=5.5.1"
  nicolaielectronics/esp-hosted-tanmatsu:
    rules:
      - if: "target == esp32p4  && $CONFIG{USE_GENERIC_ESP_HOSTED} == False"
    version: ">=2.12.3"
  espressif/esp_hosted:
    rules:
      - if: "target == esp32p4  && $CONFIG{USE_GENERIC_ESP_HOSTED} == True"
    version: "=2.12.3"
  nicolaielectronics/sx126x:
    version: "^0.3.0"
license: "MIT"
